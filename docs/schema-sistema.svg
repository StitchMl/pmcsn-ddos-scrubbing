<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="660" fill="#ffffff"/>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2e9e5b"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d1495b"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1c427d"/></marker>
  </defs>

  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1c427d">Nodo di scrubbing DDoS — schema a code</text>

  <!-- ============================ PANNELLO A: BASE ============================ -->
  <text x="30" y="74" font-size="16" font-weight="bold" fill="#1c427d">A · SISTEMA ATTUALE (modello base)</text>
  <line x1="30" y1="82" x2="950" y2="82" stroke="#dfe6ef" stroke-width="1.5"/>

  <!-- arrivi -->
  <text x="70" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e9e5b">λ₁ legittimo</text>
  <text x="70" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#d1495b">λ₂ attacco</text>
  <line x1="120" y1="130" x2="250" y2="160" stroke="#2e9e5b" stroke-width="3" marker-end="url(#g)"/>
  <line x1="120" y1="190" x2="250" y2="165" stroke="#d1495b" stroke-width="3" marker-end="url(#r)"/>

  <!-- coda unica (buffer K) : rettangolo aperto a destra con slot -->
  <text x="315" y="120" text-anchor="middle" font-size="12" fill="#555">buffer unico  K=2000</text>
  <path d="M260,140 H370 M260,190 H370 M260,140 V190" fill="none" stroke="#1c427d" stroke-width="2"/>
  <line x1="285" y1="140" x2="285" y2="190" stroke="#1c427d" stroke-width="1"/>
  <line x1="310" y1="140" x2="310" y2="190" stroke="#1c427d" stroke-width="1"/>
  <line x1="335" y1="140" x2="335" y2="190" stroke="#1c427d" stroke-width="1"/>

  <!-- freccia coda -> serventi -->
  <line x1="370" y1="165" x2="410" y2="165" stroke="#1c427d" stroke-width="2.5" marker-end="url(#b)"/>

  <!-- serventi = 4 cerchi con mu -->
  <g fill="#dbe6f5" stroke="#1c427d" stroke-width="2">
    <circle cx="445" cy="120" r="17"/><circle cx="445" cy="160" r="17"/>
    <circle cx="445" cy="200" r="17"/><circle cx="445" cy="240" r="17"/>
  </g>
  <g font-size="13" fill="#1c427d" text-anchor="middle">
    <text x="445" y="125">μ</text><text x="445" y="165">μ</text>
    <text x="445" y="205">μ</text><text x="445" y="245">μ</text>
  </g>
  <text x="445" y="272" text-anchor="middle" font-size="12" fill="#555">m = 4 serventi</text>

  <!-- uscita -->
  <line x1="466" y1="180" x2="560" y2="180" stroke="#2e9e5b" stroke-width="3" marker-end="url(#g)"/>
  <text x="600" y="184" text-anchor="middle" font-size="13" fill="#1c427d">serviti → sito</text>

  <!-- perdita -->
  <line x1="315" y1="140" x2="315" y2="105" stroke="#d1495b" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#r)"/>
  <text x="660" y="150" font-size="13" font-weight="bold" fill="#d1495b">persi (P_loss)</text>
  <text x="660" y="168" font-size="12" fill="#d1495b">anche legittimi!</text>

  <text x="30" y="300" font-size="13" fill="#333">Problema: <tspan font-weight="bold">un solo buffer condiviso</tspan> — l'attacco lo riempie e alla porta vengono respinti anche i legittimi.</text>

  <!-- ==================== PANNELLO B: CONTROMISURE ==================== -->
  <text x="30" y="352" font-size="16" font-weight="bold" fill="#1c427d">B · DOVE IPOTIZZIAMO LE MODIFICHE</text>
  <line x1="30" y1="360" x2="950" y2="360" stroke="#dfe6ef" stroke-width="1.5"/>

  <!-- arrivi -->
  <text x="70" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e9e5b">λ₁ legittimo</text>
  <text x="70" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#d1495b">λ₂ attacco</text>
  <line x1="120" y1="420" x2="250" y2="420" stroke="#2e9e5b" stroke-width="3" marker-end="url(#g)"/>
  <line x1="120" y1="500" x2="185" y2="500" stroke="#d1495b" stroke-width="3" marker-end="url(#r)"/>

  <!-- (3) controllo d'ammissione / rate-limit sull'attacco -->
  <rect x="180" y="484" width="68" height="32" rx="6" fill="#fff3dd" stroke="#e9a13b" stroke-width="2"/>
  <text x="214" y="504" text-anchor="middle" font-size="11" fill="#e08a1e" font-weight="bold">③ rate-limit</text>
  <line x1="248" y1="500" x2="255" y2="500" stroke="#d1495b" stroke-width="3" marker-end="url(#r)"/>

  <!-- (1) DUE code separate: corsia riservata legittimo + coda attacco -->
  <text x="315" y="400" text-anchor="middle" font-size="12" fill="#2e9e5b" font-weight="bold">① corsia riservata (Fast-Track)</text>
  <path d="M260,410 H370 M260,435 H370 M260,410 V435" fill="none" stroke="#2e9e5b" stroke-width="2"/>
  <line x1="285" y1="410" x2="285" y2="435" stroke="#2e9e5b" stroke-width="1"/>
  <line x1="310" y1="410" x2="310" y2="435" stroke="#2e9e5b" stroke-width="1"/>
  <line x1="335" y1="410" x2="335" y2="435" stroke="#2e9e5b" stroke-width="1"/>

  <path d="M260,490 H370 M260,515 H370 M260,490 V515" fill="none" stroke="#d1495b" stroke-width="2"/>
  <line x1="285" y1="490" x2="285" y2="515" stroke="#d1495b" stroke-width="1"/>
  <line x1="310" y1="490" x2="310" y2="515" stroke="#d1495b" stroke-width="1"/>
  <line x1="335" y1="490" x2="335" y2="515" stroke="#d1495b" stroke-width="1"/>
  <text x="315" y="533" text-anchor="middle" font-size="12" fill="#d1495b">coda attacco</text>

  <line x1="370" y1="422" x2="415" y2="440" stroke="#2e9e5b" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="370" y1="502" x2="415" y2="475" stroke="#d1495b" stroke-width="2.5" marker-end="url(#r)"/>

  <!-- serventi: 4 fissi + 2 in autoscaling (tratteggiati) -->
  <g fill="#dbe6f5" stroke="#1c427d" stroke-width="2">
    <circle cx="450" cy="420" r="16"/><circle cx="450" cy="455" r="16"/>
    <circle cx="450" cy="490" r="16"/><circle cx="450" cy="525" r="16"/>
  </g>
  <g fill="#eef7f0" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="4 3">
    <circle cx="450" cy="560" r="16"/><circle cx="450" cy="595" r="16"/>
  </g>
  <g font-size="12" fill="#1c427d" text-anchor="middle">
    <text x="450" y="424">μ</text><text x="450" y="459">μ</text>
    <text x="450" y="494">μ</text><text x="450" y="529">μ</text>
  </g>
  <g font-size="12" fill="#2e9e5b" text-anchor="middle">
    <text x="450" y="564">μ</text><text x="450" y="599">μ</text>
  </g>
  <text x="560" y="585" font-size="12" fill="#2e9e5b" font-weight="bold">② autoscaling</text>
  <text x="560" y="602" font-size="11" fill="#2e9e5b">serventi attivati al picco</text>

  <!-- uscita -->
  <line x1="470" y1="455" x2="560" y2="455" stroke="#2e9e5b" stroke-width="3" marker-end="url(#g)"/>
  <text x="600" y="459" text-anchor="middle" font-size="13" fill="#1c427d">serviti → sito</text>

  <!-- legenda contromisure -->
  <rect x="650" y="395" width="300" height="120" rx="8" fill="#f6fbf7" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="665" y="418" font-size="13" font-weight="bold" fill="#2e9e5b">Contromisure da simulare</text>
  <text x="665" y="440" font-size="12" fill="#222">① Corsia riservata / priorità all'ingresso</text>
  <text x="665" y="460" font-size="12" fill="#222">    (il legittimo non viene mai respinto)</text>
  <text x="665" y="482" font-size="12" fill="#222">② Autoscaling: +serventi durante il picco</text>
  <text x="665" y="504" font-size="12" fill="#222">③ Rate-limit sul traffico d'attacco</text>
</svg>
