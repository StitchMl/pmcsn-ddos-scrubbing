<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="740" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1f3b63"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1f8a4c"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#b23a48"/></marker>
    <style>
      .lab{font-size:14px;fill:#333}
      .sym{font-style:italic;font-family:Georgia,serif}
      .hd{font-size:15px;font-weight:bold;fill:#1f3b63;letter-spacing:.5px}
      .cap{font-size:12.5px;fill:#666}
      .note{font-size:13px;fill:#444}
    </style>
  </defs>

  <text x="500" y="40" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f3b63">Nodo di scrubbing DDoS — modello a rete di code</text>

  <!-- ======================= A. MODELLO BASE ======================= -->
  <text x="60" y="86" class="hd">A.  MODELLO BASE</text>
  <line x1="60" y1="96" x2="940" y2="96" stroke="#e3e8ef" stroke-width="1.5"/>

  <!-- arrivi -->
  <text x="60" y="152" class="lab"><tspan class="sym" fill="#1f8a4c">λ</tspan><tspan font-size="10" dy="3" fill="#1f8a4c">1</tspan><tspan dy="-3">  legittimo</tspan></text>
  <text x="60" y="250" class="lab"><tspan class="sym" fill="#b23a48">λ</tspan><tspan font-size="10" dy="3" fill="#b23a48">2</tspan><tspan dy="-3">  attacco</tspan></text>
  <line x1="150" y1="158" x2="240" y2="198" stroke="#1f8a4c" stroke-width="2" marker-end="url(#arg)"/>
  <line x1="150" y1="244" x2="240" y2="212" stroke="#b23a48" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="246" cy="206" r="3.5" fill="#1f3b63"/>

  <!-- coda (buffer) : rotaie + slot -->
  <g stroke="#1f3b63" stroke-width="1.8" fill="none">
    <path d="M258,186 H368 M258,226 H368 M258,186 V226"/>
    <line x1="284" y1="186" x2="284" y2="226"/><line x1="308" y1="186" x2="308" y2="226"/><line x1="332" y1="186" x2="332" y2="226"/>
  </g>
  <line x1="368" y1="206" x2="400" y2="206" stroke="#1f3b63" stroke-width="1.8" marker-end="url(#ar)"/>
  <!-- perdita: sopra la coda -->
  <line x1="313" y1="186" x2="313" y2="150" stroke="#b23a48" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="313" y="142" text-anchor="middle" font-size="12.5" fill="#b23a48">persi</text>
  <!-- etichetta buffer: sotto la coda -->
  <text x="313" y="248" text-anchor="middle" class="cap">coda · buffer  K = 2000</text>

  <!-- serventi -->
  <rect x="406" y="128" width="96" height="156" rx="6" fill="#f5f8fc" stroke="#1f3b63" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#1f3b63" stroke-width="1.8">
    <circle cx="454" cy="152" r="16"/><circle cx="454" cy="190" r="16"/><circle cx="454" cy="228" r="16"/><circle cx="454" cy="266" r="16"/>
  </g>
  <g class="sym" font-size="15" fill="#1f3b63" text-anchor="middle">
    <text x="454" y="157">μ</text><text x="454" y="195">μ</text><text x="454" y="233">μ</text><text x="454" y="271">μ</text>
  </g>
  <text x="454" y="304" text-anchor="middle" class="cap">m = 4 serventi</text>

  <!-- uscita -->
  <line x1="502" y1="206" x2="588" y2="206" stroke="#1f3b63" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="600" y="202" class="lab">completati</text>
  <text x="600" y="220" class="cap">→ sito protetto</text>

  <!-- parametri -->
  <text x="700" y="180" class="cap"><tspan class="sym">μ</tspan> = 2000 req/s   (E[<tspan class="sym">S</tspan>] = 0,5 ms)</text>
  <text x="700" y="202" class="cap"><tspan class="sym">λ</tspan><tspan font-size="9" dy="3">1</tspan><tspan dy="-3"> = 4000 req/s · </tspan><tspan class="sym">λ</tspan><tspan font-size="9" dy="3">2</tspan><tspan dy="-3">,picco = 60000 req/s</tspan></text>

  <!-- osservazione -->
  <rect x="60" y="322" width="880" height="30" rx="5" fill="#fbf0f1" stroke="#b23a48" stroke-width="1"/>
  <text x="74" y="342" class="note">Buffer <tspan font-weight="bold">unico e condiviso</tspan>: al picco l'attacco lo satura e alla porta si perdono <tspan font-weight="bold" fill="#b23a48">anche i legittimi</tspan> (circa 88%).</text>

  <!-- ================= B. MODELLO MIGLIORATIVO ================= -->
  <text x="60" y="404" class="hd">B.  MODELLO MIGLIORATIVO — punti d'intervento</text>
  <line x1="60" y1="414" x2="940" y2="414" stroke="#e3e8ef" stroke-width="1.5"/>

  <!-- arrivi -->
  <text x="60" y="470" class="lab"><tspan class="sym" fill="#1f8a4c">λ</tspan><tspan font-size="10" dy="3" fill="#1f8a4c">1</tspan><tspan dy="-3">  legittimo</tspan></text>
  <text x="60" y="590" class="lab"><tspan class="sym" fill="#b23a48">λ</tspan><tspan font-size="10" dy="3" fill="#b23a48">2</tspan><tspan dy="-3">  attacco</tspan></text>
  <line x1="150" y1="464" x2="252" y2="464" stroke="#1f8a4c" stroke-width="2" marker-end="url(#arg)"/>
  <line x1="150" y1="584" x2="196" y2="584" stroke="#b23a48" stroke-width="2" marker-end="url(#arr)"/>

  <!-- (3) rate-limit -->
  <rect x="198" y="567" width="72" height="34" rx="5" fill="#fff5e6" stroke="#d98a1f" stroke-width="1.6"/>
  <text x="234" y="581" text-anchor="middle" font-size="11.5" fill="#b9781a" font-weight="bold">rate-limit</text>
  <text x="234" y="595" text-anchor="middle" font-size="11" fill="#b9781a">③</text>
  <line x1="270" y1="584" x2="282" y2="584" stroke="#b23a48" stroke-width="2" marker-end="url(#arr)"/>

  <!-- coda riservata (verde) -->
  <text x="330" y="440" text-anchor="middle" font-size="12" fill="#1f8a4c" font-weight="bold">① corsia riservata (Fast-Track)</text>
  <g stroke="#1f8a4c" stroke-width="1.8" fill="none">
    <path d="M274,452 H376 M274,480 H376 M274,452 V480"/>
    <line x1="300" y1="452" x2="300" y2="480"/><line x1="324" y1="452" x2="324" y2="480"/><line x1="348" y1="452" x2="348" y2="480"/>
  </g>
  <!-- coda attacco (rosso) -->
  <g stroke="#b23a48" stroke-width="1.8" fill="none">
    <path d="M284,570 H376 M284,598 H376 M284,570 V598"/>
    <line x1="310" y1="570" x2="310" y2="598"/><line x1="334" y1="570" x2="334" y2="598"/><line x1="358" y1="570" x2="358" y2="598"/>
  </g>
  <text x="330" y="616" text-anchor="middle" class="cap">coda attacco (bassa priorità)</text>

  <line x1="376" y1="466" x2="412" y2="488" stroke="#1f8a4c" stroke-width="1.8" marker-end="url(#arg)"/>
  <line x1="376" y1="584" x2="412" y2="562" stroke="#b23a48" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- serventi: 4 fissi + 2 autoscaling -->
  <rect x="418" y="432" width="94" height="224" rx="6" fill="#f5f8fc" stroke="#1f3b63" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#1f3b63" stroke-width="1.8">
    <circle cx="465" cy="456" r="15"/><circle cx="465" cy="492" r="15"/><circle cx="465" cy="528" r="15"/><circle cx="465" cy="564" r="15"/>
  </g>
  <g fill="#f0f8f2" stroke="#1f8a4c" stroke-width="1.8" stroke-dasharray="4 3">
    <circle cx="465" cy="600" r="15"/><circle cx="465" cy="634" r="15"/>
  </g>
  <g class="sym" font-size="14" text-anchor="middle">
    <text x="465" y="461" fill="#1f3b63">μ</text><text x="465" y="497" fill="#1f3b63">μ</text><text x="465" y="533" fill="#1f3b63">μ</text><text x="465" y="569" fill="#1f3b63">μ</text>
    <text x="465" y="605" fill="#1f8a4c">μ</text><text x="465" y="639" fill="#1f8a4c">μ</text>
  </g>
  <text x="560" y="606" font-size="12" fill="#1f8a4c" font-weight="bold">② autoscaling</text>
  <text x="560" y="623" class="cap">serventi attivati al picco</text>

  <!-- uscita -->
  <line x1="512" y1="500" x2="588" y2="500" stroke="#1f8a4c" stroke-width="2" marker-end="url(#arg)"/>
  <text x="600" y="504" class="lab">completati</text>

  <!-- legenda -->
  <rect x="690" y="442" width="250" height="120" rx="6" fill="#f4faf6" stroke="#1f8a4c" stroke-width="1.3"/>
  <text x="706" y="466" font-size="13" font-weight="bold" fill="#1f8a4c">Interventi da simulare</text>
  <text x="706" y="490" class="note">① Priorità all'ingresso / Fast-Track</text>
  <text x="706" y="512" class="note">② Autoscaling dei serventi</text>
  <text x="706" y="534" class="note">③ Rate-limit sull'attacco</text>
  <text x="706" y="554" class="cap">confronto base vs migliorativo (Step 8)</text>
</svg>
